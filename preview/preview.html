<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web to Markdown — 预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="brand">Web to MD</span>
      <span class="quality-badge" id="qualityBadge" title="内容质量评分"></span>
      <span class="token-count" id="tokenCount" title="估算 Token 数"></span>
    </div>
    <div class="toolbar-right">
      <div class="toggles">
        <label class="toggle" title="去除图片">
          <input type="checkbox" id="toggleImages" checked>
          <span>图片</span>
        </label>
        <label class="toggle" title="去除链接，保留文字">
          <input type="checkbox" id="toggleLinks" checked>
          <span>链接</span>
        </label>
        <label class="toggle" title="添加元数据头部">
          <input type="checkbox" id="toggleMeta" checked>
          <span>元数据</span>
        </label>
      </div>
      <div class="actions">
        <button id="btnCopy" title="复制 Markdown">复制</button>
        <button id="btnCopyPrompt" title="复制为 LLM Prompt">复制为 Prompt</button>
        <button id="btnDownload" title="下载 .md 文件">下载</button>
      </div>
    </div>
  </div>

  <!-- 主内容区：左右分栏 -->
  <div class="editor-container">
    <div class="pane editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="Markdown 内容加载中..."></textarea>
    </div>
    <div class="pane preview-pane" id="previewPane">
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>

  <!-- 提示条 -->
  <div class="toast" id="toast"></div>

  <script src="../lib/marked.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
