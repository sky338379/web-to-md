<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      padding: 16px;
      font-family: "Inter", -apple-system, sans-serif;
      background: #18181b;
      color: #e4e4e7;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      background: #27272a;
      color: #e4e4e7;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .btn:hover { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .btn .label { font-weight: 600; }
    .btn .desc { font-size: 11px; color: #a1a1aa; margin-top: 2px; }
    .btn:hover .desc { color: #dbeafe; }
    .shortcut {
      font-size: 11px;
      color: #71717a;
      text-align: center;
      margin-top: 8px;
    }
    kbd {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="title">Web to Markdown</div>
  <button class="btn" id="btnDownload">
    <div class="label">一键下载</div>
    <div class="desc">提取并自动下载 .md 文件</div>
  </button>
  <button class="btn" id="btnPreview">
    <div class="label">预览编辑</div>
    <div class="desc">打开编辑器，可控制内容再导出</div>
  </button>
  <div class="shortcut">快捷键 <kbd>Alt</kbd>+<kbd>M</kbd> 一键下载</div>
  <script src="popup.js"></script>
</body>
</html>
